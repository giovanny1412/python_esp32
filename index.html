<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control ESP32 con Web Serial</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; color: #333; }
        h1 { color: #0066cc; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #0066cc; color: white; border: none; border-radius: 5px; margin-right: 10px; }
        button:hover { background: #0051a2; }
        #terminal { width: 100%; height: 250px; background: #1e1e1e; color: #00ff00; font-family: monospace; padding: 10px; box-sizing: border-box; overflow-y: scroll; border-radius: 5px; margin-top: 20px; }
        .controls { margin-top: 15px; }
        input[type="text"] { padding: 8px; width: 300px; font-size: 16px; }
    </style>
</head>
<body>

    <h1>Programar ESP32 desde GitHub Pages</h1>
    <p>Conecta tu ESP32 por USB y presiona el botón para interactuar mediante Web Serial.</p>

    <button id="connectBtn">Conectar ESP32</button>
    <button id="disconnectBtn" style="background: #cc0000; display:none;">Desconectar</button>

    <div class="controls">
        <input type="text" id="commandInput" placeholder="Escribe comando MicroPython (ej. print('Hola'))">
        <button id="sendBtn" disabled>Enviar</button>
    </div>

    <div id="terminal">Consola de comunicación...\n</div>

    <script>
        let port;
        let reader;
        let keepReading = false;

        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const sendBtn = document.getElementById('sendBtn');
        const commandInput = document.getElementById('commandInput');
        const terminal = document.getElementById('terminal');

        function appendToTerminal(text) {
            terminal.innerText += text;
            terminal.scrollTop = terminal.scrollHeight;
        }

        // 1. Conectar al ESP32 por Web Serial
        connectBtn.addEventListener('click', async () => {
            try {
                // Solicita al usuario que elija el puerto COM de su ESP32
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 }); // Baudrate estándar para MicroPython

                connectBtn.style.display = 'none';
                disconnectBtn.style.display = 'inline-block';
                sendBtn.disabled = false;
                appendToTerminal('\n[Sistema] Conectado exitosamente al ESP32.\n');

                keepReading = true;
                readLoop();
            } catch (error) {
                console.error('Error al conectar:', error);
                alert('No se pudo conectar al puerto serial.');
            }
        });

        // 2. Leer datos continuos que envía el ESP32
        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            try {
                while (keepReading) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        appendToTerminal(value);
                    }
                }
            } catch (error) {
                console.error('Error de lectura:', error);
            } finally {
                reader.releaseLock();
            }
        }

        // 3. Enviar comandos escritos al ESP32
        async function sendCommand() {
            const command = commandInput.value;
            if (!port || !command) return;

            const textEncoder = new TextEncoderStream();
            const writableStreamClosed = textEncoder.readable.pipeTo(port.writable);
            const writer = textEncoder.writable.getWriter();

            await writer.write(command + '\r\n');
            commandInput.value = '';
            await writer.close();
        }

        sendBtn.addEventListener('click', sendCommand);
        commandInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendCommand();
        });

        // 4. Desconectar
        disconnectBtn.addEventListener('click', async () => {
            keepReading = false;
            if (reader) await reader.cancel();
            if (port) await port.close();

            connectBtn.style.display = 'inline-block';
            disconnectBtn.style.display = 'none';
            sendBtn.disabled = true;
            appendToTerminal('\n[Sistema] Desconectado.\n');
        });
    </script>

</body>
</html>
